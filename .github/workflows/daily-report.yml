name: Trae 每日用量日报

on:
  schedule:
    # 北京时间每天 9:00（UTC 1:00）
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 执行日报
        env:
          TRAE_ADMIN_API_KEY: ${{ secrets.TRAE_ADMIN_API_KEY }}
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
          DEPT_MAPPING: ${{ secrets.DEPT_MAPPING }}
        run: node src/index.js